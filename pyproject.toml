[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owaspscan"
version = "0.1.0"
description = "Minimal CLI that statically detects likely OWASP Top 10 issues in source code"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
owaspscan = "owaspscan.cli:main"

[tool.setuptools.packages.find]
include = ["owaspscan*"]
